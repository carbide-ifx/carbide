settings:
  kotlin:
    version: 2.4.10
  publishing:
    group: io.carbide-ifx
    version: 0.1.0
    enabled: true
    mavenCentral: enabled
    signArtifacts: true
    publishSources: true
    pom:
      url: https://carbide-ifx.io
      scm: https://github.com/carbide-ifx/carbide.git
      developers:
        - name: Carbide contributors
          organization: Carbide
          organizationUrl: https://carbide-ifx.io
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt

repositories:
  - id: local
    publish: true
    resolve: true
    url: mavenLocal
