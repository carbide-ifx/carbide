apply: [ ../publishing.module-template.yaml, ../common.module-template.yaml ]

product: jvm/lib

# Public subsystem-hosting surface. Keep these exports explicit so consumers
# need one runtime dependency while still choosing listeners, extensions,
# interceptors, and exposed services at their application boundary.
dependencies:
  - ../ifx.actuator: exported
  - ../ifx.context: exported
  - ../ifx.host: exported
  - ../ifx.host.tooling: exported
  - ../ifx.logging: exported
  - ../ifx.protocol.contract: exported
  - ../ifx.protocol.jsonrpc: exported
  - ../ifx.protocol.rsocket: exported
  - ../ifx.proxy-factory.jsonrpc: exported
  - ../ifx.proxy-factory.rsocket: exported
  - ../ifx.service: exported
  - ../ifx.telemetry.otel: exported

  # The current KMP publications of the modules above carry macOS variants in
  # their JVM POMs. Re-declare the JVM runtime here so an external subsystem
  # does not need to reproduce that workaround itself.
  - co.touchlab:kermit:2.1.0: exported
  - io.ktor:ktor-client-cio:3.1.1: exported
  - io.ktor:ktor-client-core:3.1.1: exported
  - io.ktor:ktor-client-websockets:3.1.1: exported
  - io.ktor:ktor-server-cio:3.1.1: exported
  - io.ktor:ktor-server-core:3.1.1: exported
  - io.rsocket.kotlin:ktor-client-rsocket:0.20.0: exported
  - io.rsocket.kotlin:ktor-server-rsocket:0.20.0: exported
