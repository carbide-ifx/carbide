settings:
  kotlin:
    version: 2.4.10
    serialization: enabled
  publishing:
    group: sonat
    version: 0.0.6
    enabled: true
dependencies:
  - $kotlin.serialization.json
  - org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2: exported
test-dependencies:
  - ./ifx.testing: exported

repositories:
  - id: github
    publish: true
    resolve: true
    url: https://maven.pkg.github.com/Sonat-Consulting-Trondheim/ifx.kotlin
    credentials:
      file: repository-credentials.properties
      usernameKey: github.username
      passwordKey: github.token
  - id: local
    publish: true
    resolve: false
    url: mavenLocal
