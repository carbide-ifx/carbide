settings:
  kotlin:
    serialization: enabled
  publishing:
    group: sonat
    version: 0.0.5-LOCAL
dependencies:
  - $kotlin.serialization.json
test-dependencies:
  - ./ifx.test

repositories:
  - id: github
    publish: true
    resolve: true
    url: https://maven.pkg.github.com/Sonat-Consulting-Trondheim/ifx.kotlin
    credentials:
      file: repository-credentials.properties
      usernameKey: github.username
      passwordKey: github.token
  - id: local
    publish: true
    resolve: false
    url: mavenLocal
  - id: snap
    publish: false
    resolve: false
    url: https://localhost/snapshots
    credentials:
      file: repository-credentials.properties
      usernameKey: reposilite.username
      passwordKey: reposilite.token
