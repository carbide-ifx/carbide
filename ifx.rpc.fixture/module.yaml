apply: [ ../common.module-template.yaml ]

product:
  type: lib
  platforms: [ jvm, macosArm64 ]

settings:
  kotlin:
    ksp:
      processors:
        - ../ifx.rpc.ksp
    compilerPlugins:
      - id: ifx.rpc.compiler
        dependency: sonat:ifx-rpc-compiler-plugin:0.0.6

dependencies:
  - ../ifx.host.base
  - ../ifx.protocol.contract
  - ../ifx.proxy-factory.base
  - ../ifx.service
