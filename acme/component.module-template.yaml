settings:
  kotlin:
    serialization: enabled
  publishing:
    group: acme
    version: 0.0.1-SNAPSHOT

dependencies:
  - $kotlin.serialization.json
  - org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2
test-dependencies:
  - $libs.ifx.test
repositories:
  - id: snap
    publish: true
    resolve: true
    url: https://localhost:443/snapshots
    credentials:
      file: ../repository-credentials.properties
      usernameKey: reposilite.username
      passwordKey: reposilite.token

