apply: [ ../publishing.module-template.yaml, ../common.module-template.yaml ]

product:
  type: jvm/app

settings:
  jvm:
    mainClass: TestSystemKt
  kotlin:
    ksp:
      processors:
        - ../ifx.subsystem.ksp
        - ../ifx.rpc.typescript.ksp
    compilerPlugins:
      - id: ifx.rpc.compiler
        dependency: sonat:ifx-rpc-compiler-plugin:0.0.8

dependencies:
  - ../test.service-contracts
  - ../ifx.subsystem
  - ../utility.stdlib

plugins:
  ifx.jib:
    enabled: true
    image: ifx/test-system:dev
    environment:
      IFX_SERVICE_EXPLORER_DIRECTORY: /app/webapps/service-explorer
    extraDirectories:
      - source: //typescript/ifx-test-ui/dist
        destination: /app/webapps/service-explorer
