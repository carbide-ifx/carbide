apply: [ ../common.module-template.yaml ]

product:
  type: macos/app
  platforms: [ macosArm64 ]

settings:
  kotlin:
    ksp:
      processors:
        - ../ifx.rpc.ksp
    compilerPlugins:
      - id: ifx.rpc.compiler
        dependency: sonat:ifx-rpc-compiler-plugin:0.0.6

dependencies:
  - ../ifx.host.rsocket
  - ../ifx.proxy-factory.rsocket
  - ../ifx.protocol.contract
  - ../ifx.telemetry.otel
  - ../ifx.logging
  - ../ifx.service
  - ../utility.stdlib
