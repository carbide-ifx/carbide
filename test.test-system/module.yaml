apply: [ ../common.module-template.yaml ]

product:
  type: jvm/app

settings:
  kotlin:
    ksp:
      processors:
        - ../ifx.rpc.ksp
        - ../ifx.rpc.typescript.ksp
    compilerPlugins:
      - id: ifx.rpc.compiler
        dependency: sonat:ifx-rpc-compiler-plugin:0.0.7

dependencies:
  - ../ifx.actuator
  - ../ifx.host
  - ../ifx.host.tooling
  - ../ifx.protocol.rsocket
  - ../ifx.protocol.jsonrpc
  - ../ifx.proxy-factory.rsocket
  - ../ifx.proxy-factory.jsonrpc
  - ../ifx.protocol.contract
  - ../ifx.telemetry.otel
  - ../ifx.logging
  - ../ifx.service
  - ../utility.stdlib
