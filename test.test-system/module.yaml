apply: [ ../common.module-template.yaml ]

product:
  type: jvm/app

repositories:
  - id: local
    resolve: true
    url: mavenLocal

settings:
  jvm:
    mainClass: TestSystemKt
  kotlin:
    version: 2.4.10
    ksp:
      processors:
        - ../ifx.subsystem.ksp
        - ../ifx.rpc.typescript.ksp
    compilerPlugins:
      - id: ifx.rpc.compiler
        dependency: io.carbide-ifx:ifx.rpc.compiler:0.1.0

dependencies:
  - ../test.service-contracts
  - ../ifx.subsystem
  - ../ifx.stdlib

test-dependencies:
  - co.touchlab:kermit:2.1.0

plugins:
  ifx.build.jib:
    enabled: true
    image: ifx/test-system:dev
