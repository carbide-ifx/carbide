apply: [ ../common.module-template.yaml ]

product:
  type: lib
  platforms: [ jvm, macosArm64 ]

settings:
  kotlin:
    ksp:
      processors:
        - ../ifx.rpc.ksp
        - ../ifx.rpc.typescript.ksp
    compilerPlugins:
      - id: ifx.rpc.compiler
        dependency: sonat:ifx-rpc-compiler-plugin:0.0.7

dependencies:
  - co.touchlab:kermit:2.1.0
  - ../ifx.host.contract
  - ../ifx.logging: exported
  - ../ifx.protocol.contract: exported
  - ../ifx.service: exported
