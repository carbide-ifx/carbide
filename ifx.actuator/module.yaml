apply: [ ../publishing.module-template.yaml, ../common.module-template.yaml ]

description: Diagnostics, health checks, service catalog, and structured log streaming for Carbide hosts.

product:
  type: lib
  platforms: [ jvm, macosArm64 ]

settings:
  kotlin:
    ksp:
      processors:
        - ../ifx.contract.ksp

dependencies:
  - co.touchlab:kermit:2.1.0
  - ../ifx.host.contract
  - ../ifx.logging: exported
  - ../ifx.protocol.contract: exported
  - ../ifx.service: exported
