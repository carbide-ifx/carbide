apply: [ ../common.module-template.yaml ]

product:
  type: lib
  platforms: [ jvm, macosArm64 ]

repositories:
  - id: local
    resolve: true
    url: mavenLocal

settings:
  kotlin:
    version: 2.4.10
    ksp:
      processors:
        - ../ifx.subsystem.ksp
    compilerPlugins:
      - id: ifx.rpc.compiler
        dependency: io.carbide-ifx:ifx.rpc.compiler:0.1.0

plugins:
  ifx.build.gateway:
    enabled: true

dependencies:
  - ../test.service-contracts
  - ../ifx.gateway
  - ../ifx.gateway.contract
  - ../ifx.gateway.ktor
  - ../ifx.gateway.typescript
  - ../ifx.logging
  - ../ifx.protocol.contract
  - ../ifx.protocol.rsocket
  - ../ifx.service
  - ../ifx.subsystem

test-dependencies@jvm:
  - io.ktor:ktor-server-test-host:3.1.1
