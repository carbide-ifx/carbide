apply: [ ../publishing.module-template.yaml, ../common.module-template.yaml ]

product:
  type: lib
  platforms: [ jvm, macosArm64 ]

settings:
  kotlin:
    ksp:
      processors:
        - ../ifx.subsystem.ksp
    compilerPlugins:
      - id: ifx.rpc.compiler
        dependency: sonat:ifx-rpc-compiler-plugin:0.0.9

plugins:
  ifx.gateway.artifacts:
    enabled: true

dependencies:
  - ../test.service-contracts
  - ../ifx.gateway
  - ../ifx.gateway.contract
  - ../ifx.gateway.ktor
  - ../ifx.gateway.typescript
  - ../ifx.logging
  - ../ifx.protocol.contract
  - ../ifx.protocol.rsocket
  - ../ifx.service
  - ../ifx.subsystem

test-dependencies@jvm:
  - io.ktor:ktor-server-test-host:3.1.1
