apply: [ ../common.module-template.yaml ]

product:
  type: lib
  platforms: [ jvm, macosArm64 ]

repositories:
  - id: local
    resolve: true
    url: mavenLocal

settings:
  kotlin:
    version: 2.4.10
    ksp:
      processors:
        - ../ifx.subsystem.ksp
    compilerPlugins:
      - id: ifx.rpc.compiler
        dependency: io.carbide-ifx:ifx.rpc.compiler:0.1.0

dependencies:
  - ../test.service-contracts
  - ../ifx.subsystem
